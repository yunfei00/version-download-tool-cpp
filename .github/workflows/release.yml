name: Build and Release Windows Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Dev Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |
          $exePath = Resolve-Path "build/Release/VersionDownloadTool.exe"
          & windeployqt --release --compiler-runtime $exePath

      - name: Package
        shell: pwsh
        run: |
          $staging = "build/package/VersionDownloadTool"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "build/Release/VersionDownloadTool.exe" -Destination $staging
          Copy-Item "build/Release/*.dll" -Destination $staging -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging/*" -DestinationPath "build/VersionDownloadTool-win64.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/VersionDownloadTool-win64.zip
