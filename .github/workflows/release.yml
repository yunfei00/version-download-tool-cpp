name: Build and Release Windows Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Dev Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package with windeployqt
        shell: pwsh
        run: |
          $packageDir = "package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "build/Release/VersionDownloadTool.exe" -Destination "$packageDir/VersionDownloadTool.exe" -Force

          windeployqt --release --compiler-runtime --dir $packageDir "$packageDir/VersionDownloadTool.exe"

      - name: Validate packaged Qt runtime
        shell: pwsh
        run: |
          $requiredFiles = @(
            "package/VersionDownloadTool.exe",
            "package/Qt6Core.dll",
            "package/Qt6Gui.dll",
            "package/Qt6Widgets.dll",
            "package/platforms/qwindows.dll"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing required packaged file: $file"
              exit 1
            }
          }

      - name: Archive package
        shell: pwsh
        run: |
          Compress-Archive -Path "package/*" -DestinationPath "VersionDownloadTool-win64.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: VersionDownloadTool-win64.zip
